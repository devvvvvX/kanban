name: Kanban CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kanban-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 – Automated Test & Typecheck Suites
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Test & Lint
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compiler check
        run: npm run typecheck

      - name: Run Vitest test suites
        run: npm test

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check --locked

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 – Build Standalone macOS App & DMG Installer
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build macOS App & DMG
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend & MCP bundle
        run: npm run build

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri desktop application & DMG
        run: npx tauri build --bundles app,dmg

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release

          APP="$(find src-tauri/target/release/bundle -type d -name '*.app' -print -quit)"
          if [ -n "$APP" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP" dist-release/Kanban-macos.zip
          fi

          find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -exec cp {} dist-release/ \; 2>/dev/null || true

          echo "=== Release Artifacts ==="
          ls -lh dist-release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kanban-macos
          path: dist-release/*
          if-no-files-found: warn
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 – Publish GitHub Release (v* tags only)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Kanban-macos
          path: dist-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-release/*

