name: Bug Report
description: Report a bug, defect, or unexpected behavior in Kanban
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Before submitting, please ensure you are running the latest version of Kanban.
  - type: input
    id: version
    attributes:
      label: Kanban Version
      description: What version of Kanban are you running? (Found in Preferences > About)
      placeholder: "e.g., 1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS Version & Architecture
      description: What version of macOS and processor architecture are you using?
      placeholder: "e.g., macOS 14.5 Sonoma (Apple Silicon M2 Pro)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When opening a ticket drawer..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      value: |
        1. Open Kanban
        2. Navigate to '...'
        3. Click on '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Console Output
      description: Paste any error messages from the browser developer console or terminal output.
      render: shell

