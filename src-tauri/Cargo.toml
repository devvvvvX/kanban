[package]
name = "macos-kanban-board"
version = "1.0.0"
description = "macOS Kanban & Personal Project Management App"
authors = ["devvvvvX"]
edition = "2021"

[lib]
name = "macos_kanban_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
